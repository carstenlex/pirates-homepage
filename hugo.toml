baseURL = "https://carstenlex.github.io/pirates-homepage/"
locale = "de-DE"
defaultContentLanguage = "de"
title = "Pirates Basketball"
theme = "blowfish"
disableLanguages = ["en"]
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 10

[params]
  description = "Pirates Basketball"
  colorScheme = "pirates"
  defaultAppearance = "dark"
  autoSwitchAppearance = false
  logo = "img/logo-pirates-white-clear.png"
  enableSearch = false
  enableCodeCopy = false
  spielterminFeed = "https://calendar.google.com/calendar/ical/k9638oppgo52acvljql7f1piss%40group.calendar.google.com/public/basic.ics"

  [params.header]
    layout = "basic"

  [params.footer]
    showCopyright = false
    showThemeAttribution = false
    showAppearanceSwitcher = false
    showScrollToTop = true

  [params.homepage]
    layout = "hero"
    showRecent = false
    showRecentItems = 3
    showMoreLink = true
    showMoreLinkDest = "/news/"

  [params.article]
    showDate = true
    showReadingTime = false
    showTableOfContents = false
    showAuthor = false
    showBreadcrumbs = false
    showPagination = false
    showWordCount = false
    showTaxonomies = false
    showEdit = false
    showHero = false
    showSummary = true
    showViews = false
    showLikes = false

  [params.list]
    showBreadcrumbs = false
    showSummary = true
    showCards = false
    groupByYear = false
    cardView = false

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "Über uns"
  pageRef = "about"
  weight = 20

# News vorübergehend ausgeblendet (Seite /news/ bleibt gebaut). Zum Wiedereinschalten einkommentieren.
# [[menu.main]]
#   name = "News"
#   pageRef = "news"
#   weight = 40

[[menu.main]]
  name = "Kontakt"
  pageRef = "kontakt"
  weight = 30

[[menu.footer]]
  name = "Impressum"
  pageRef = "impressum"
  weight = 10

[[menu.footer]]
  name = "Datenschutz"
  pageRef = "datenschutz"
  weight = 20
